name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements-dev.txt
      - run: python scripts/sync_skills.py --check
      - run: python -m pytest -q
  # The FPGA examples need Quartus and a board, so CI checks the repo (skills, pages, links, hygiene) only; the
  # examples are built and verified locally (scripts/de10.py) and each page records what was checked.
